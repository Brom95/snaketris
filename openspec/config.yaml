schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

# Project requirements
# This project uses OpenSpec for network play. The project supports local network play
# without requiring a public STUN server. If a STUN server is needed, the user can supply
# one via the transport configuration in js/app.js (ICE_SERVERS). The change
# network-play implements local-network-only play without a server.

# STUN server list
# The project uses the hardcoded list of online STUN servers from:
# https://raw.githubusercontent.com/pradt2/always-online-stun/master/valid_hosts.txt
# This list is refreshed whenever a fresh list of online STUN servers is needed.
