schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

# Project requirements
# This project uses OpenSpec for network play. Network play runs in one of two
# flows a page belongs to for its whole life. The global flow needs a candidate
# supply both pages can reach: either the public list read once per open, or an
# address the page is told to name via ?ice=stun:... carried in the pairing link.
# The local flow needs no list and no server, but it does need a precondition:
# each peer types its own device's dotted-quad address and offers the other that
# address, so local-network play works only where the two devices' sockets can
# reach each other. It is not true that local-network play works without any
# candidate supply.

# STUN server list
# The project uses the hardcoded list of online STUN servers from:
# https://raw.githubusercontent.com/pradt2/always-online-stun/master/valid_hosts.txt
# This list is refreshed whenever a fresh list of online STUN servers is needed.
