<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>snaketris</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0e14;
      font-family: monospace;
    }
    canvas { display: block; }
    #hint {
      position: fixed;
      bottom: 12px;
      left: 0;
      right: 0;
      text-align: center;
      color: rgba(232, 236, 244, 0.45);
      font-size: 13px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hint">arrows / WASD to steer &middot; R or click to start / restart</div>
  <script>
    // snaketris — single-file Snake/Tetris hybrid.
    // All game code lives here; no external assets or dependencies.

    // ---------- Constants ----------

    // Grid cell identities
    const EMPTY = 0;
    const SNAKE = 1;
    const EDIBLE = 2;
    const SOLID = 3;

    // Logical grid size (cells), scaled to CSS pixels
    const COLS = 24;
    const ROWS = 30;
    const CELL = 24; // cell size in CSS pixels

    // State machine
    const IDLE = 'IDLE';
    const PLAYING = 'PLAYING';
    const GAME_OVER = 'GAME_OVER';

    // Timing (fixed-timestep)
    const TICK = 1 / 60;        // fixed update step, seconds
    const SNAKE_STEP = 8;       // snake advances one cell every N ticks
    const SPAWN_INTERVAL = 60;  // new piece every N ticks
    const BASE_FALL = 0.12;     // base piece fall speed, cells per tick
    const MAX_FALL = 0.9;       // hard cap so pieces never tunnel a cell
    const MAX_PIECES = 8;       // cap concurrent pieces on the board

    // Palette
    const COLORS = {
      bg: '#0b0e14',
      grid: 'rgba(255,255,255,0.05)',
      snake: '#4ade80',
      snakeHead: '#a7f3a0',
      edible: '#7dd3fc',
      solid: '#f97316',
      text: '#e8ecf4',
      overlay: 'rgba(11,14,20,0.8)',
    };

    // The seven classic tetrominoes as [dr, dc] offsets from the anchor.
    const TETROMINOES = [
      [[0, 0], [0, 1], [0, 2], [0, 3]], // I
      [[0, 0], [0, 1], [1, 0], [1, 1]], // O
      [[0, 1], [1, 0], [1, 1], [1, 2]], // T
      [[0, 1], [0, 2], [1, 0], [1, 1]], // S
      [[0, 0], [0, 1], [1, 1], [1, 2]], // Z
      [[0, 0], [1, 0], [2, 0], [2, 1]], // L
      [[0, 2], [1, 0], [2, 0], [2, 1]], // J
    ];

    // ---------- Canvas ----------
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    canvas.width = COLS * CELL;
    canvas.height = ROWS * CELL;

    // ---------- State ----------
    let state = IDLE;
    let snake = [];      // list of {r, c}, head first
    let pieces = [];     // list of { shape, col, row }
    let score = 0;
    let landedBlocks = 0;
    let dir = { r: 0, c: 1 };     // current movement direction
    let nextDir = { r: 0, c: 1 }; // queued direction (applied on next snake step)

    // ---------- Grid model ----------
    // grid[row][col] — every cell carries an identity:
    // EMPTY | SNAKE | EDIBLE | SOLID
    // Snakes and falling pieces are tracked in their own lists; the grid
    // holds EMPTY/SOLID (plus the SNAKE/EDIBLE identities for completeness).
    let grid = [];

    function initGrid() {
      grid = [];
      for (let r = 0; r < ROWS; r++) {
        grid.push(new Array(COLS).fill(EMPTY));
      }
    }

    function getCell(row, col) {
      return grid[row][col];
    }

    function setCell(row, col, id) {
      grid[row][col] = id;
    }

    // ---------- Piece geometry helpers ----------

    // Cells a falling piece currently occupies, clipped to the grid.
    function pieceCells(p) {
      const cells = [];
      for (const [dr, dc] of p.shape) {
        const r = Math.floor(p.row + dr);
        const c = p.col + dc;
        if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
          cells.push({ r, c });
        }
      }
      return cells;
    }

    // Find a falling piece occupying grid cell (r, c); returns indices or null.
    function findPieceAt(r, c) {
      for (let i = 0; i < pieces.length; i++) {
        const p = pieces[i];
        for (let j = 0; j < p.shape.length; j++) {
          const [dr, dc] = p.shape[j];
          if (Math.floor(p.row + dr) === r && p.col + dc === c) {
            return { pieceIdx: i, shapeIdx: j };
          }
        }
      }
      return null;
    }

    // ---------- Difficulty ramp ----------

    function currentFallSpeed() {
      const tier = Math.floor(landedBlocks / 2);
      return Math.min(MAX_FALL, BASE_FALL * Math.pow(1.08, tier));
    }

    // ---------- Piece lifecycle ----------

    function spawnPiece() {
      if (pieces.length >= MAX_PIECES) return;
      const shape = TETROMINOES[Math.floor(Math.random() * TETROMINOES.length)];
      const col = Math.floor(Math.random() * (COLS - 3)); // fits widest piece
      const row = -5; // above the top of the grid
      pieces.push({ shape, col, row });
    }

    // Advance one piece by one tick. Lands (snaps to grid as SOLID) if the
    // next position would collide with the bottom or a solid — checking the
    // *next* cells prevents the piece from ever overlapping an obstacle.
    function stepPiece(p) {
      const nextRow = p.row + currentFallSpeed();
      for (const [dr, dc] of p.shape) {
        const nr = Math.floor(nextRow + dr);
        const nc = p.col + dc;
        if (nc < 0 || nc >= COLS) continue;
        // Above the grid is empty fall space; only test cells inside it.
        if (nr < 0) continue;
        if (nr >= ROWS || getCell(nr, nc) === SOLID) {
          landPiece(p);
          return;
        }
      }
      p.row = nextRow;
    }

    function landPiece(p) {
      for (const [dr, dc] of p.shape) {
        const r = Math.floor(p.row + dr);
        const c = p.col + dc;
        if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
          setCell(r, c, SOLID);
          landedBlocks += 1;
        }
      }
      const idx = pieces.indexOf(p);
      if (idx >= 0) pieces.splice(idx, 1);
    }

    // ---------- Snake movement ----------

    function moveSnake() {
      if (state !== PLAYING) return;
      dir = { r: nextDir.r, c: nextDir.c };
      const head = snake[0];
      // Discrete step with wrap-around via modulo (applied before any check).
      let nr = head.r + dir.r;
      let nc = head.c + dir.c;
      nr = ((nr % ROWS) + ROWS) % ROWS;
      nc = ((nc % COLS) + COLS) % COLS;

      // Death: head touches a solid (landed) block.
      if (getCell(nr, nc) === SOLID) {
        gameOver();
        return;
      }

      // Eating: consume the edible cell of any falling piece here, +1 score.
      let willGrow = false;
      const hit = findPieceAt(nr, nc);
      if (hit) {
        const p = pieces[hit.pieceIdx];
        p.shape.splice(hit.shapeIdx, 1);
        score += 1;
        willGrow = true;
        if (p.shape.length === 0) {
          const idx = pieces.indexOf(p);
          if (idx >= 0) pieces.splice(idx, 1);
        }
      }

      // Death: self-collision (tail is vacated only when not growing).
      const bodyToCheck = willGrow ? snake : snake.slice(0, snake.length - 1);
      for (const seg of bodyToCheck) {
        if (seg.r === nr && seg.c === nc) {
          gameOver();
          return;
        }
      }

      // Classic growth: unshift the head; drop the tail only when not growing.
      snake.unshift({ r: nr, c: nc });
      if (!willGrow) snake.pop();
    }

    // ---------- State transitions ----------

    function resetGame() {
      state = IDLE;
      initGrid();
      const mid = Math.floor(ROWS / 2);
      snake = [
        { r: mid, c: 6 },
        { r: mid, c: 5 },
        { r: mid, c: 4 },
        { r: mid, c: 3 },
      ];
      dir = { r: 0, c: 1 };
      nextDir = { r: 0, c: 1 };
      pieces = [];
      score = 0;
      landedBlocks = 0;
      snakeAcc = 0;
      spawnAcc = 0;
    }

    function startGame() {
      if (state === PLAYING) return;
      resetGame();
      state = PLAYING;
      spawnPiece();
    }

    function restart() {
      startGame();
    }

    function gameOver() {
      state = GAME_OVER;
    }

    // ---------- Fixed-timestep game loop ----------
    // update() runs at a constant TICK; render() runs every rAF frame.
    // When the tab is hidden rAF stops, so the game pauses cleanly and resumes
    // without a time jump (dt is clamped on resume).

    let acc = 0;
    let last = performance.now();
    let snakeAcc = 0;
    let spawnAcc = 0;
    let tick = 0;

    function update() {
      if (state !== PLAYING) return;
      tick++;
      for (const p of pieces.slice()) stepPiece(p); // slice: pieces can be removed
      spawnAcc += 1;
      if (spawnAcc >= SPAWN_INTERVAL) {
        spawnAcc = 0;
        spawnPiece();
      }
      snakeAcc += 1;
      if (snakeAcc >= SNAKE_STEP) {
        snakeAcc = 0;
        moveSnake();
      }
    }

    function frame(now) {
      requestAnimationFrame(frame);
      const dt = Math.min((now - last) / 1000, 0.1);
      last = now;
      acc += dt;
      while (acc >= TICK) {
        acc -= TICK;
        update();
      }
      render();
    }

    // ---------- Render ----------

    function drawCell(r, c) {
      ctx.fillRect(c * CELL + 1, r * CELL + 1, CELL - 2, CELL - 2);
    }

    function drawGrid() {
      ctx.strokeStyle = COLORS.grid;
      ctx.lineWidth = 1;
      for (let c = 0; c <= COLS; c++) {
        ctx.beginPath();
        ctx.moveTo(c * CELL, 0);
        ctx.lineTo(c * CELL, canvas.height);
        ctx.stroke();
      }
      for (let r = 0; r <= ROWS; r++) {
        ctx.beginPath();
        ctx.moveTo(0, r * CELL);
        ctx.lineTo(canvas.width, r * CELL);
        ctx.stroke();
      }
    }

    function drawText(text, x, y, opts = {}) {
      ctx.fillStyle = opts.color || COLORS.text;
      ctx.font = opts.font || '16px monospace';
      ctx.textAlign = opts.align || 'center';
      ctx.textBaseline = opts.baseline || 'middle';
      ctx.fillText(text, x, y);
    }

    function drawOverlay(title, sub) {
      ctx.fillStyle = COLORS.overlay;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      drawText(title, canvas.width / 2, canvas.height / 2 - 14, { font: 'bold 30px monospace' });
      if (sub) {
        drawText(sub, canvas.width / 2, canvas.height / 2 + 18, { font: '16px monospace' });
      }
    }

    function render() {
      ctx.fillStyle = COLORS.bg;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      drawGrid();

      // Solid blocks
      ctx.fillStyle = COLORS.solid;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (grid[r][c] === SOLID) drawCell(r, c);
        }
      }

      // Falling pieces (edible while falling)
      ctx.fillStyle = COLORS.edible;
      for (const p of pieces) {
        for (const cell of pieceCells(p)) drawCell(cell.r, cell.c);
      }

      // Snake
      for (let i = 0; i < snake.length; i++) {
        ctx.fillStyle = i === 0 ? COLORS.snakeHead : COLORS.snake;
        drawCell(snake[i].r, snake[i].c);
      }

      // Score
      drawText('Score: ' + score, 16, 16, { align: 'left', baseline: 'top', font: 'bold 16px monospace' });

      // Overlays
      if (state === IDLE) {
        drawOverlay('snaketris', 'Press R or click to start');
      } else if (state === GAME_OVER) {
        drawOverlay('Game Over', 'Press R or click to restart');
      }
    }

    // ---------- Input ----------

    function keyToDir(key) {
      switch (key) {
        case 'arrowup': case 'w': return { r: -1, c: 0 };
        case 'arrowdown': case 's': return { r: 1, c: 0 };
        case 'arrowleft': case 'a': return { r: 0, c: -1 };
        case 'arrowright': case 'd': return { r: 0, c: 1 };
        default: return null;
      }
    }

    function onKey(e) {
      const key = e.key.toLowerCase();
      if (key === 'r') {
        if (state !== PLAYING) restart();
        return;
      }
      if (state !== PLAYING) return;
      const d = keyToDir(key);
      if (!d) return;
      // No-reverse rule: block the exact opposite of the current direction.
      if (d.r === -dir.r && d.c === -dir.c) return;
      nextDir = d;
      e.preventDefault();
    }

    function onClick() {
      if (state !== PLAYING) restart();
    }

    canvas.addEventListener('keydown', onKey);
    document.addEventListener('keydown', onKey);
    canvas.addEventListener('click', onClick);

    // ---------- Init ----------
    resetGame();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
